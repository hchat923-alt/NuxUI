    {
      "@context": "https://schema.org",
      "@type": "WebApplication",

      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "All",

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nux_theme_v1');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <script async src="https://js.puter.com/v2/"></script>
    <script>
      // Suppress transient Vite WebSocket errors in preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var msg = String(event.reason.message || event.reason || '');
          if (msg.includes('WebSocket') || msg.includes('websocket')) {
            event.preventDefault();
          }
        }
      });
    </script>
